# ImLazy configuration file

[settings]
default = "build"

[variables]
prefix = "/usr/local"
bindir = "{{prefix}}/bin"
binary = "rvn"
target = "target/release/{{binary}}"

[commands]

[commands.build]
desc = "Build release binary"
alias = ["b"]
run = ["cargo build --release"]

[commands.test]
desc = "Run all tests"
alias = ["t"]
run = ["cargo test --locked --all-targets"]

[commands.check]
desc = "Run formatting, Clippy, and the full locked test suite"
run = [
  "cargo fmt --check",
  "cargo clippy --locked --all-targets -- -D warnings",
  "cargo test --locked --all-targets",
]

[commands.format]
desc = "Format the code with rustfmt"
alias = ["fmt", "f"]
run = ["cargo fmt --all"]

[commands.install]
desc = "Install rvn to /usr/local/bin (may need sudo)"
dep = ["build"]
run = [
  "echo \"Installing {{binary}} to {{bindir}}...\"",
  "install -d {{bindir}}",
  "install -m 755 {{target}} {{bindir}}/{{binary}}",
  "echo \"Installed {{binary}} to {{bindir}}/{{binary}}\"",
  "echo \"Run 'rvn --version' to verify.\"",
]

[commands.uninstall]
desc = "Uninstall rvn from /usr/local/bin (may need sudo)"
run = [
  "echo \"Removing {{bindir}}/{{binary}}...\"",
  "rm -f {{bindir}}/{{binary}}",
  "echo \"Uninstalled {{binary}}\"",
]

[commands.clean]
desc = "Clean build artifacts"
run = ["cargo clean"]
