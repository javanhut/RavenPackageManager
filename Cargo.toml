[package]
name = "ravenpackagemanager"
version = "0.1.0"
edition = "2024"

[dependencies]
clap = "4.6.6"
flate2 = "1.1.9"
hex = "0.4.3"
pgp = "0.20.0"
ruzstd = "0.9.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.11.0"
tar = "0.4.46"
terminal_size = "0.4.4"
ureq = "3.4.0"

[[bin]]
name = "rvn"
path = "src/main.rs"

[lib]
name = "rvn"
path = "src/lib.rs"
